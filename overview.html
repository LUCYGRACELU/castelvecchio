    :root{--bg:#080d1b;--panel:#111a30;--line:#284263;--ink:#eaf2ff;--muted:#9aa8bf;--cyan:#55e9ff;--violet:#9f84ff;--warn:#ffd47e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 0,#253a70,transparent 28%),var(--bg);color:var(--ink);font:15px/1.6 Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:32px}.nav{display:flex;justify-content:space-between;gap:12px;align-items:center}.link{color:var(--cyan);border:1px solid #27748b;border-radius:20px;padding:7px 11px;text-decoration:none}.ey{font-size:11px;letter-spacing:2px;color:var(--cyan);margin-top:45px}h1{font-size:44px;line-height:1.1;margin:8px 0}.lead{max-width:730px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:30px 0}.card{background:rgba(17,26,48,.9);border:1px solid var(--line);border-radius:12px;padding:18px}.num{font-size:37px;font-weight:800;color:var(--cyan)}.label{color:var(--muted);font-size:12px;letter-spacing:1px}.section{margin-top:31px}.section h2{font-size:16px;color:var(--cyan)}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(40,66,99,.7);padding:9px 0}.tag{padding:2px 7px;border-radius:10px;background:#282149;color:#ddd3ff;font-size:12px}.warn{color:var(--warn)}@media(max-width:760px){.wrap{padding:20px}.grid,.two{grid-template-columns:1fr 1fr}.nav{align-items:flex-start;flex-direction:column}h1{font-size:34px}}

<body><main class="wrap">

  <div class="ey">EXPERIMENT OVERVIEW · 实验总览</div><h1>从图像到证据的<br>Computer Vision 实验</h1><p class="lead">本页概览数据集规模、开放词汇检测与交互式分割实验。模型输出是视觉线索；对象归属与建筑时间层仍由人工和资料共同判断。</p>
  <section class="grid" id="cards"></section>
  <section class="section two"><div class="card"><h2>GROUNDING DINO · 对象检测</h2><p class="label">开放词汇检测：对象能否被正确定位？</p><div id="detectionSummary"></div></div><div class="card"><h2>SAM · 边界分割</h2><p class="label">交互式分割：增加提示后，边界是否更可靠？</p><div id="samSummary"></div></div></section>
  <section class="section card"><h2>研究结论边界</h2><p><span class="tag">AI 可见</span> 对象、材料、空间线索与边界候选。</p><p><span class="tag">人工核验</span> 建筑年代、Scarpa 归属、历史原真性、艺术品身份。</p><p class="warn">视觉相似、检测框或分割蒙版均不等于历史事实。</p></section>
</main><script src="gallery_manifest.js"></script><script src="detection_data.js"></script><script src="segmentation_data.js"></script><script>
const gallery=window.galleryData||[],detect=(window.detectionData||{}).records||[],sam=(window.segmentationData||{}).records||[];const groupCounts=['A','B','C','D'].map(group=>gallery.filter(x=>x.group===group).length);const testedDetection=new Set(detect.map(x=>x.image_id)).size,testedSam=new Set(sam.map(x=>x.image_id)).size;document.getElementById('cards').innerHTML=[['图片数据集',gallery.length,'A/B/C/D 四组'],['检测实验',testedDetection,'张图 · 2 轮提示词'],['SAM 分割',testedSam,`${sam.length} 次交互结果`],['人工核验',5,'L0–L4 时间层规则']].map(card=>`<article class="card"><div class="label">${card[0]}</div><div class="num">${card[1]}</div><div class="label">${card[2]}</div></article>`).join('');const count=(rows,key)=>rows.reduce((a,row)=>{const k=row[key]||'待实验';a[k]=(a[k]||0)+1;return a},{});const rows=obj=>Object.entries(obj).map(([key,value])=>`<div class="row"><span>${key}</span><b>${value}</b></div>`).join('');document.getElementById('detectionSummary').innerHTML=rows(count(detect,'结果'));document.getElementById('samSummary').innerHTML=rows(count(sam,'结果等级'));</script></body></html>
