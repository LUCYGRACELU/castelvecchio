<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Reader · Castelvecchio</title><style>body{margin:0;background:#080d1b;color:#eaf2ff;font:15px/1.65 Arial,"Microsoft YaHei"}.wrap{max-width:980px;margin:auto;padding:32px}.link{color:#55e9ff;text-decoration:none}.ey{margin-top:45px;color:#55e9ff;font-size:11px;letter-spacing:2px}h1{font-size:46px;margin:8px 0}.lead{color:#9aa8bf}.grid{display:grid;gap:15px;margin-top:28px}.card{border:1px solid #284263;background:#111a30;border-radius:12px;padding:19px}.tag{display:inline-block;border-radius:12px;padding:3px 8px;font-size:12px;background:#33284e;color:#e1d8ff}.status{color:#ffd47e}.card h2{font-size:20px;margin:8px 0}.card p{color:#c9d3e6}.meta{color:#9aa8bf;font-size:13px}.source{color:#55e9ff}.rule{border-left:3px solid #9f84ff;padding:12px 16px;background:#10192e;margin-top:30px}</style></head><body><main class="wrap"><a class="link" href="case-overview.html">← 返回案例总览</a><div class="ey">EVIDENCE READER · 证据阅读器</div><h1>结论必须能回到证据</h1><p class="lead">每张图片上的模型观察、资料来源与人工历史判断被明确区分。以下是当前案例的示例证据卡。</p><section class="grid" id="evidence"></section><div class="rule"><b>使用规则：</b>AI 的图像观察可以作为线索；建筑年代、作者归属与历史原真性必须由资料和人工共同核验。</div></main><script src="case_data.js"></script><script>document.getElementById('evidence').innerHTML=window.caseData.evidence.map(x=>`<article class="card"><span class="tag">图片 ${x.id}</span><h2>${x.claim}</h2><p class="meta">AI 可观察对象：${x.objects}</p><p class="status">核验状态：${x.status}</p><p>支持资料：<a class="source" target="_blank" rel="noopener" href="${x.url}">${x.source} ↗</a></p><a class="link" href="workbench.html#image=${x.id}">查看图片与实验结果 →</a></article>`).join('')</script></body></html>
