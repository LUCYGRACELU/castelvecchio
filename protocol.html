</style></head><body><main class="wrap"><a class="back" href="workbench.html">← Back to workbench</a><div class="ey">HISTORICAL INTERPRETATION PROTOCOL</div><h1>Layer Protocol</h1><p class="lead">Models observe objects and materials. L0–L4 labels require human verification supported by sources.</p><div class="grid" id="cards"></div></main><script src="codebook_data.js"></script><script>document.getElementById('cards').innerHTML=(window.codebookData?.layers||[]).map(r=>`<article class="card"><h2>${r.layer_id||''}</h2><p>${r['Layer name']||''}</p><h3>Meaning</h3><p>${r['Meaning']||''}</p><h3>Supporting evidence</h3><p>${r['Supporting sources']||''}</p><h3>Insufficient on its own</h3><p>${r['Insufficient evidence']||''}</p></article>`).join('')</script></body></html>
