<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Layer Protocol</title><style>body{margin:0;background:#070b17;color:#eaf2ff;font:15px/1.6 Arial,"Microsoft YaHei"}.wrap{max-width:1100px;margin:auto;padding:36px}.back{color:#55e9ff}.ey{color:#55e9ff;font-size:11px;letter-spacing:2px;margin-top:40px}h1{font-size:48px;margin:8px 0}.lead{color:#9eacc2;max-width:760px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px;margin-top:28px}.card{background:#121c33;border:1px solid #284263;border-radius:12px;padding:17px}.card h2{margin:0;color:#55e9ff}.card h3{font-size:11px;color:#9f84ff;letter-spacing:1px}.card p{color:#c8d2e4}</style></head><body><main class="wrap"><a class="back" href="workbench.html">← 返回工作台</a><div class="ey">HISTORICAL INTERPRETATION PROTOCOL</div><h1>Layer Protocol</h1><p class="lead">模型观察对象与材料；L0–L4 必须经人工和资料核验。</p><div class="grid" id="cards"></div></main><script src="codebook_data.js"></script><script>document.getElementById('cards').innerHTML=(window.codebookData?.layers||[]).map(r=>`<article class="card"><h2>${r.layer_id||''}</h2><p>${r['中文层级']||''}</p><h3>含义</h3><p>${r['含义']||''}</p><h3>可作为依据</h3><p>${r['可以作为判断依据的资料']||''}</p><h3>不能单独作为依据</h3><p>${r['不能单独作为依据的内容']||''}</p></article>`).join('')</script></body></html>
