<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial Explorer · Castelvecchio</title><style>body{margin:0;background:#080d1b;color:#eaf2ff;font:15px/1.65 Arial,"Microsoft YaHei"}.wrap{max-width:1150px;margin:auto;padding:32px}.link{color:#55e9ff;text-decoration:none}.ey{margin-top:45px;color:#55e9ff;font-size:11px;letter-spacing:2px}h1{font-size:46px;margin:8px 0}.lead{color:#9aa8bf}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.card{display:block;color:#eaf2ff;text-decoration:none;border:1px solid #284263;border-radius:12px;padding:18px;background:linear-gradient(145deg,#142443,#0d1428);min-height:185px}.card:hover{border-color:#55e9ff}.card h2{margin:0;font-size:20px}.en{color:#55e9ff;font-size:12px}.card p{color:#9aa8bf}.ids{color:#d9d0ff;font-size:12px}@media(max-width:760px){.wrap{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="link" href="case-overview.html">← 返回案例总览</a><div class="ey">SPATIAL EXPLORER · 空间浏览</div><h1>从空间，而非文件夹，理解案例</h1><p class="lead">A/B/C/D 保留为实验数据分类；这里以可感知的建筑空间组织图片、展品与 AI 实验。</p><section class="grid" id="spaces"></section></main><script src="case_data.js"></script><script>document.getElementById('spaces').innerHTML=window.caseData.spaces.map(x=>`<a class="card" href="workbench.html#space=${x.id}"><h2>${x.name}</h2><div class="en">${x.en}</div><p>${x.description}</p><div class="ids">相关样本：${x.ids.join(' · ')}</div></a>`).join('')</script></body></html>
